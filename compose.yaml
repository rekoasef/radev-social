# Stack local (fases 0 a 3). Ver docs/ARCHITECTURE.md §2.
#   docker compose up -d postgres   → solo la base, para desarrollar con `pnpm dev`
#   docker compose up -d --build    → todo: base, migraciones + seed, web y worker
name: radev-social

# Conexión desde adentro de la red de Docker: host `postgres`, puerto interno 5432.
x-database-url: &database-url postgres://${POSTGRES_USER:-radev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radev_social}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copiá .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-radev_social}
    ports:
      # Solo accesible desde esta máquina. 5433 porque 5432 lo usa el Postgres nativo de WSL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre una vez en cada `up`: aplica migraciones pendientes y agrega marcas faltantes.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      # Pisa el DATABASE_URL del .env, que apunta a localhost:5433 (fuera de Docker).
      DATABASE_URL: *database-url
    ports:
      # Mismo puerto que `pnpm dev`: la OAuth App de GitHub apunta a localhost:3000, así que
      # no se pueden usar los dos a la vez. WEB_PORT permite otro puerto solo para pruebas.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Tiempo para terminar jobs en curso al apagar (el worker espera hasta 30 s).
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
