# Stack local (fases 0 a 3). Ver docs/ARCHITECTURE.md §2.
#   docker compose up -d postgres   → solo la base, para desarrollar con `pnpm dev`
#   docker compose up -d --build    → todo: base, migraciones + seed, web y worker
#   docker compose --profile video up -d --build web video-worker
#                                   → el estudio de video: la web y las oficinas (sin el worker
#                                     de redes, que en local no hace falta)
name: radev-social

# Conexión desde adentro de la red de Docker: host `postgres`, puerto interno 5432.
x-database-url: &database-url postgres://${POSTGRES_USER:-radev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radev_social}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copiá .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-radev_social}
    ports:
      # Solo accesible desde esta máquina. 5433 porque 5432 lo usa el Postgres nativo de WSL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre una vez en cada `up`: aplica migraciones pendientes y agrega marcas faltantes
  # (y sus assets, que copia a ./media).
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
      MEDIA_DIR: /data/media
    volumes:
      - ./media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      # Pisa el DATABASE_URL del .env, que apunta a localhost:5433 (fuera de Docker).
      DATABASE_URL: *database-url
      MEDIA_DIR: /data/media
    volumes:
      # La misma carpeta que usa `pnpm dev`: los dos comparten la base, así que tienen que
      # compartir también los archivos a los que apunta. El usuario `node` del contenedor
      # (uid 1000) es el mismo que el de WSL, así que los dos pueden escribir.
      - ./media:/data/media
    ports:
      # Mismo puerto que `pnpm dev`: la OAuth App de GitHub apunta a localhost:3000, así que
      # no se pueden usar los dos a la vez. WEB_PORT permite otro puerto solo para pruebas.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    # RENDER_TOKEN: abre las páginas internas de render de la web.
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_DIR: /data/media
      # La web por la red interna de Docker.
      WEB_INTERNAL_URL: http://web:3000
    volumes:
      # Los PNG renderizados, en la misma carpeta que sirve la web.
      - ./media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Renderiza a través de la web (si todavía está arrancando, el job reintenta).
      web:
        condition: service_started
    # Tiempo para terminar jobs en curso al apagar (el worker espera hasta 30 s).
    stop_grace_period: 40s
    restart: unless-stopped

  # RAdev Studio (T13): las oficinas del video. Solo con el perfil `video`, así `up -d` sigue igual.
  # Gasta Claude y créditos de voz en cuanto toma un video: no arranca solo la primera vez.
  video-worker:
    build:
      context: .
      target: video-worker
    profiles: ["video"]
    # CLAUDE_CODE_OAUTH_TOKEN y ELEVENLABS_API_KEY.
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_DIR: /data/media
    volumes:
      # Las imágenes, la voz y los videos, en la misma carpeta que sirve la web.
      - ./media:/data/media
    # Chrome (Remotion) usa memoria compartida; los 64 MB de Docker no alcanzan para el render.
    shm_size: 1gb
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Termina el trabajo corto en curso; un render cortado se retoma solo después.
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
