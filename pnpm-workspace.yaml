packages:
  - apps/*
  - packages/*
  # Solo en la rama spike/video-v0: pruebas descartables de RAdev Studio.
  - spikes/*

# Versiones compartidas: los paquetes ponen "catalog:" y todos resuelven la misma. Zod va acá
# porque sus tipos cruzan paquetes; dos copias hacen que tsc compare las dos librerías enteras
# (2026-11-24: más de 2,5 GB y corte por falta de memoria). Versión EXACTA, sin ^: con rango, un paquete
# nuevo resolvía la 4.6.7 y volvía el problema (2026-11-25).
catalog:
  zod: 4.6.5

# Paquetes autorizados a ejecutar scripts al instalarse (pnpm los bloquea por defecto).
allowBuilds:
  esbuild: true
  # Elige el binario de Claude Code de la plataforma (packages/ai, fase 3 T4).
  '@anthropic-ai/claude-code': true

# pnpm no instala versiones publicadas hace muy poco (protección ante paquetes comprometidos).
# Excepciones explícitas para versiones fijadas que eran muy recientes al instalarlas.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - turbo@2.11.3
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - next@16.3.6
  - '@anthropic-ai/claude-code@2.1.282'
  - '@anthropic-ai/claude-code-linux-x64@2.1.282'
  - '@anthropic-ai/claude-code-linux-arm64@2.1.282'
  - '@anthropic-ai/claude-code-linux-x64-musl@2.1.282'
  - '@anthropic-ai/claude-code-linux-arm64-musl@2.1.282'
  - '@anthropic-ai/claude-code-darwin-x64@2.1.282'
  - '@anthropic-ai/claude-code-darwin-arm64@2.1.282'
  - '@anthropic-ai/claude-code-win32-x64@2.1.282'
  - '@anthropic-ai/claude-code-win32-arm64@2.1.282'
